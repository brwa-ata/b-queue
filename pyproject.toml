[project]
name = "b-queue"
version = "0.1.0"
description = "Laravel-style queues and scheduled tasks for Django's built-in task framework, stored in your database or Redis."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["django>=6.0"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]

[project.urls]
Repository = "https://github.com/brwa-ata/b-queue"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "redis>=5.0",
    "fakeredis[lua]>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["b_queue"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--tb=short -ra"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.format]
quote-style = "single"
